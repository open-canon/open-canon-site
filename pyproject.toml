[project]
name = "open-canon-site"
version = "1.8.0"
description = "Static site generator for OSIS XML scriptural documents"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "jinja2>=3.1.0",
    "markdown>=3.7",
    "pyosis>=0.2.1",
]

[project.scripts]
open-canon-site = "open_canon_site.__main__:main"
open-canon-scrape = "open_canon_site.scrapers.cli:main"

[project.optional-dependencies]
scrapers = [
    "beautifulsoup4>=4.13",
    "httpx>=0.28",
    "tqdm>=4.67",
]
dev = [
    "beautifulsoup4>=4.13",
    "httpx>=0.28",
    "tqdm>=4.67",
    "hypothesis>=6.100",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=5.0",
    "python-semantic-release>=10.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_canon_site"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/open_canon_site/scrapers/**" = ["E501"]
"tests/scrapers/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit the network (run with OPEN_CANON_NETWORK_TESTS=1)",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/open_canon_site/__init__.py:__version__"]
branch = "main"
commit_message = "chore(release): v{version} [skip ci]"
